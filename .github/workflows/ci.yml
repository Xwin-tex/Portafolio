name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm install
      - run: npm run lint --if-present || npx eslint script.js
      - run: npm run format:check --if-present || npx prettier --check .
      - run: npm run build --if-present || echo "no build needed (static)"

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Run Lighthouse CI (informational)
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            https://xwin-tex.github.io/Portafolio/
          uploadArtifacts: true
          temporaryPublicStorage: true
